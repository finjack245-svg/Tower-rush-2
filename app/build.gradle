plugins {
    id 'com.android.application'
}

android {
    namespace 'com.finjacks.towerrushassistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.finjacks.towerrushassistant'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
